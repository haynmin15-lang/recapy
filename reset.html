<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>RECAPY — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{
  --bg:#f7f8fa;
  --panel:#ffffff;
  --panel2:#f0f2f5;
  --border:#e2e6ec;
  --text:#111827;
  --muted:#6b7280;
  --accent:#10a37f;
  --accent-hover:#0d8c6d;
  --accent-soft:#e6f6f1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.wrap{width:100%;max-width:400px}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:900;letter-spacing:-0.8px;justify-content:center;margin-bottom:8px;color:var(--text)}
.logo-icon{background:var(--accent);color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;box-shadow:0 4px 12px rgba(16,163,127,.22)}
.tagline{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 8px 24px rgba(17,24,39,.05)}
h1{font-size:18px;font-weight:800;margin-bottom:6px;color:var(--text)}
p.sub{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:14px}
label{display:block;color:#374151;font-size:12px;font-weight:600;margin:14px 0 6px}
input{width:100%;background:#fff;border:1px solid #d1d5db;color:var(--text);font:14px Inter,Arial,sans-serif;padding:12px 13px;border-radius:9px;outline:none;transition:.15s}
input::placeholder{color:#9ca3af}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,163,127,.14)}
.btn{width:100%;border:0;background:var(--accent);color:#fff;font:700 14px Inter,Arial,sans-serif;padding:13px 14px;border-radius:9px;margin-top:20px;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{display:inline-block;margin-top:16px;width:100%;text-align:center;color:var(--accent);font-size:12px;font-weight:600;text-decoration:none}
.link:hover{text-decoration:underline}
.msg{display:none;margin-top:16px;padding:12px;border-radius:9px;font-size:12px;line-height:1.6}
.msg.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
.msg.ok{display:block;background:var(--accent-soft);border:1px solid #a7e3d3;color:#065f46}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><div class="logo-icon">R</div>RECAPY</div>
  <p class="tagline">Turn your voice into visual stories</p>

  <div class="card">
    <h1>Set a new password</h1>
    <p class="sub">Enter your new password below to finish resetting your account.</p>

    <form id="resetForm" novalidate>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters">

      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter new password">

      <button class="btn" id="submitBtn" type="submit">Update password</button>
    </form>

    <a class="link" href="login.html">Back to sign in</a>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
var SUPABASE_URL = 'https://jqsawjvtshlaqyhqluxb.supabase.co';
var SUPABASE_KEY = 'sb_publishable_gtDqgovcoxJSNsXUZCkPDg_7JYv9Hed';

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true }
});

var $ = function (id) { return document.getElementById(id); };

function show(text, type) {
  var m = $('msg');
  m.className = 'msg ' + type;
  m.textContent = text;
}

$('resetForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  $('msg').className = 'msg';
  var pw = $('password').value;
  var cf = $('confirm').value;

  if (pw.length < 6) { show('Password needs at least 6 characters.', 'err'); return; }
  if (pw !== cf) { show('Passwords do not match.', 'err'); return; }

  var btn = $('submitBtn');
  btn.disabled = true;
  try {
    var res = await sb.auth.updateUser({ password: pw });
    if (res.error) throw res.error;
    show('Password updated! Redirecting to sign in...', 'ok');
    setTimeout(function () { window.location.replace('login.html'); }, 1200);
  } catch (err) {
    show((err && err.message) || 'Could not update password. Open a fresh reset link.', 'err');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
