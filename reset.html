<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>RECAPY — Set new password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#090909;--panel:#111;--panel2:#171717;--border:#262626;--text:#f5f5f5;--muted:#858585;--red:#ff3535}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.wrap{width:100%;max-width:400px}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:900;letter-spacing:-1px;justify-content:center;margin-bottom:8px}
.logo-icon{background:var(--red);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:19px}
.tagline{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px}
h1{font-size:18px;font-weight:700;margin-bottom:6px}
.sub{color:var(--muted);font-size:13px;line-height:1.6}
label{display:block;color:#aaa;font-size:12px;margin:14px 0 7px}
input{width:100%;background:#141414;border:1px solid #333;color:var(--text);font:14px Inter,Arial,sans-serif;padding:13px;border-radius:8px;outline:none}
input:focus{border-color:var(--red)}
.btn{width:100%;border:0;background:var(--red);color:#fff;font:700 14px Inter,Arial,sans-serif;padding:14px;border-radius:8px;margin-top:20px;cursor:pointer;display:block;text-align:center;text-decoration:none}
.btn:hover{background:#e52525}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{display:none;margin-top:16px;padding:12px;border-radius:8px;font-size:12px;line-height:1.6}
.msg.err{display:block;background:#2a1212;border:1px solid #5a2020;color:#ff9a9a}
.msg.ok{display:block;background:#10241a;border:1px solid #1f5a3a;color:#8fe0b4}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><div class="logo-icon">R</div>RECAPY</div>
  <p class="tagline">Turn your voice into visual stories</p>

  <div class="card">
    <h1>Set a new password</h1>

    <div id="checking">
      <p class="sub" style="margin-top:8px">Checking your reset link…</p>
    </div>

    <form id="resetForm" class="hidden" novalidate>
      <p class="sub">Choose a new password for your account.</p>
      <label for="pw1">New password</label>
      <input id="pw1" type="password" autocomplete="new-password" placeholder="At least 6 characters">
      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Type it again">
      <button class="btn" id="saveBtn" type="submit">Save new password</button>
    </form>

    <div id="invalid" class="hidden">
      <div class="msg err" style="display:block;margin-top:12px">This reset link is invalid or has expired. Request a new one from the log in page. Open the new link in the same browser you used to request it.</div>
      <a class="btn" href="login.html">Back to log in</a>
    </div>

    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
var SUPABASE_URL = 'https://jqsawjvtshlaqyhqluxb.supabase.co';
var SUPABASE_KEY = 'sb_publishable_gtDqgovcoxJSNsXUZCkPDg_7JYv9Hed';

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true }
});

var $ = function (id) { return document.getElementById(id); };
var ready = false;

function show(text, type) {
  var m = $('msg');
  m.className = 'msg ' + type;
  m.textContent = text;
}
function clearMsg() { $('msg').className = 'msg'; }

function showForm() {
  ready = true;
  $('checking').classList.add('hidden');
  $('invalid').classList.add('hidden');
  $('resetForm').classList.remove('hidden');
}
function showInvalid() {
  if (ready) return;
  $('checking').classList.add('hidden');
  $('resetForm').classList.add('hidden');
  $('invalid').classList.remove('hidden');
}

// The reset link signs the user in temporarily and fires PASSWORD_RECOVERY.
// Do NOT redirect to the dashboard here.
sb.auth.onAuthStateChange(function (event) {
  if (event === 'PASSWORD_RECOVERY') showForm();
});

// Error returned in the link (expired / already used)
if (/error=|error_code=/.test(window.location.search + window.location.hash)) {
  showInvalid();
} else {
  // If no recovery event arrives, the link is not usable
  setTimeout(showInvalid, 5000);
}

$('resetForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  clearMsg();
  var p1 = $('pw1').value;
  var p2 = $('pw2').value;
  if (p1.length < 6) { show('Password needs at least 6 characters.', 'err'); return; }
  if (p1 !== p2) { show('The two passwords do not match.', 'err'); return; }

  var btn = $('saveBtn');
  btn.disabled = true;
  try {
    var res = await sb.auth.updateUser({ password: p1 });
    if (res.error) throw res.error;
    show('Password updated. Taking you to log in…', 'ok');
    await sb.auth.signOut();
    setTimeout(function () { window.location.replace('login.html'); }, 1800);
  } catch (err) {
    var t = (err && err.message) || 'Something went wrong. Try again.';
    if (/different from the old/i.test(t)) t = 'New password must be different from your old password.';
    show(t, 'err');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
