<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL = 'https://jqsawjvtshlaqyhqluxb.supabase.co';
const $ = id => document.getElementById(id);
const st = $('st'), cv = $('cv'), ctx = cv.getContext('2d'), seek = $('seek');
const audio = new Audio();
audio.preload = 'auto';
const MOODS = { negative:'#ff3535', positive:'#2ecc71', neutral:'#4a90e2', urgent:'#ff9f1a' };
const FONT = '"Noto Sans Myanmar","Padauk","Myanmar Text",sans-serif';
const MY = '၀၁၂၃၄၅၆၇၈၉';
let scenes = [], W = 1280, H = 720, dur = 0;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.70158, k = c + 1; return 1 + k * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const toEn = s => String(s).replace(/[၀-၉]/g, c => MY.indexOf(c));
const toMy = s => String(s).replace(/[0-9]/g, c => MY[+c]);
function rgba(h, a) {
  h = String(h).replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const n = parseInt(h, 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}
function fmt(t) { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function toSec(v) {
  if (typeof v === 'number') return v;
  if (typeof v === 'string') {
    if (v.includes(':')) return v.split(':').map(Number).reduce((a, b) => a * 60 + b, 0);
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }
  return 0;
}
function parseNum(s) {
  if (!s) return null;
  const raw = String(s), en = toEn(raw);
  const m = en.match(/[0-9][0-9,]*\.?[0-9]*/);
  if (!m) return null;
  const ns = m[0].replace(/,/g, ''), val = parseFloat(ns);
  if (isNaN(val)) return null;
  return { val, dec: (ns.split('.')[1] || '').length, pre: en.slice(0, m.index), suf: en.slice(m.index + m[0].length), my: /[၀-၉]/.test(raw) };
}
function fmtNum(n, x) {
  let s = (n.val * x).toFixed(n.dec);
  if (n.my) s = toMy(s);
  return n.pre + s + n.suf;
}
function seg(s) {
  try { return Array.from(new Intl.Segmenter('my', { granularity: 'grapheme' }).segment(s), x => x.segment); }
  catch (e) { return Array.from(s); }
}
function wrap(txt, maxW) {
  const out = [];
  let line = '';
  for (const tok of String(txt).split(/\s+/).filter(Boolean)) {
    const t = line ? line + ' ' + tok : tok;
    if (ctx.measureText(t).width <= maxW) { line = t; continue; }
    if (line) { out.push(line); line = ''; }
    if (ctx.measureText(tok).width <= maxW) { line = tok; continue; }
    let cur = '';
    for (const g of seg(tok)) {
      if (cur && ctx.measureText(cur + g).width > maxW) { out.push(cur); cur = g; }
      else cur += g;
    }
    line = cur;
  }
  if (line) out.push(line);

}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fit(s, size, wt, maxW) {
  ctx.font = wt + ' ' + size + 'px ' + FONT;
  const w = ctx.measureText(s).width;
  return w > maxW ? size * maxW / w : size;
}
function txt(s, x, y, size, color, wt, al) {
  ctx.font = wt + ' ' + size + 'px ' + FONT;
  ctx.fillStyle = color;
  ctx.textAlign = al || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function noShadow() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
function sceneAt(t) {
  let s = scenes[0];
  for (const c of scenes) if (t >= c.s) s = c;
  return s;
}
/* ---------- background: always moving ---------- */
function bg(col, T) {
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#090b14';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 3; i++) {
    const x = W * (.5 + .38 * Math.sin(T * .35 + i * 2.1)), y = H * (.5 + .35 * Math.cos(T * .28 + i * 1.7));
    const r = Math.max(W, H) * (.45 + .1 * Math.sin(T + i));
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(col, i ? .2 : .32));
    g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  const u = Math.min(W, H), gap = u * .07, off = (T * u * .02) % gap;
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  ctx.beginPath();
  for (let x = -gap + off; x < W + gap; x += gap) {
    for (let y = -gap + off; y < H + gap; y += gap) { ctx.moveTo(x + u * .004, y); ctx.arc(x, y, u * .004, 0, 6.283); }
  }
  ctx.fill();
  ctx.fillStyle = rgba(col, .35);
  for (let i = 0; i < 14; i++) {
    const sp = .03 + (i % 5) * .01;
    const x = ((i * .137 + T * sp) % 1) * W, y = H - ((i * .291 + T * sp * 1.5) % 1) * H;
    ctx.beginPath();
    ctx.arc(x, y, u * (.006 + (i % 4) * .004), 0, 6.283);
    ctx.fill();
  }
}
/* ---------- kinetic headline ---------- */
function kin(str, cx, cy, size, maxW, p, T, color, barCol) {
  ctx.font = '900 ' + size + 'px ' + FONT;
  const lines = wrap(str, maxW), h = size * 1.5, y0 = cy - (lines.length - 1) * h / 2;
  lines.forEach((l, i) => {
    const q = clamp((p - i * .18) / .55), e = back(q);
    ctx.save();
    ctx.globalAlpha = clamp(q * 2);
    ctx.translate(cx, y0 + i * h + (1 - e) * size * 1.2 + Math.sin(T * 1.6 + i) * size * .04);
    ctx.rotate((1 - e) * (i % 2 ? .08 : -.08));
    ctx.scale(.85 + .15 * e, .85 + .15 * e);
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = 12;
    txt(l, 0, 0, size, color, 900);
    ctx.restore();
  });
  const bw = ease((p - .5) / .5) * size * 3 * (1 + .08 * Math.sin(T * 3));
  ctx.fillStyle = barCol;
  rr(cx - bw / 2, y0 + (lines.length - 1) * h + h * .62, bw, size * .1, size * .05);
  ctx.fill();
}
function panel(cx, cy, w, h, col, s, a, fn) {
  ctx.save();
  ctx.globalAlpha = clamp(a);
  ctx.translate(cx, cy);
  const k = Math.max(.01, s);
  ctx.scale(k, k);
  ctx.shadowColor = rgba(col, .5);
  ctx.shadowBlur = 45;
  ctx.shadowOffsetY = 16;
  ctx.fillStyle = 'rgba(20,24,42,.94)';
  rr(-w / 2, -h / 2, w, h, Math.min(w, h) * .1);
  ctx.fill();
  noShadow();
  ctx.strokeStyle = rgba(col, .7);
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.restore();
}
/* ---------- scene types ---------- */
function numScene(sc, p, T, u) {
  const cw = Math.min(W * .8, u * 1.1), ch = u * .5, cy = H * .56;
  const s = back((p - .15) / .5) * (1 + .015 * Math.sin(T * 3)), a = ease((p - .1) / .3);
  const cnt = ease(p / Math.min(2.5, sc.d * .7));
  panel(W / 2, cy, cw, ch, sc.col, s, a, () => {
    const sz = fit(fmtNum(sc.num, 1), u * .2, 900, cw * .86);
    txt(fmtNum(sc.num, cnt), 0, -ch * .08, sz, sc.col, 900);
    const bw = cw * .7, by = ch * .3;
    ctx.fillStyle = 'rgba(255,255,255,.1)';
    rr(-bw / 2, by, bw, 16, 8);
    ctx.fill();
    ctx.fillStyle = sc.col;
    rr(-bw / 2, by, Math.max(16, bw * cnt), 16, 8);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-bw / 2 + bw * cnt, by + 8, 14 + 3 * Math.sin(T * 6), 0, 6.283);
    ctx.fill();
    for (let i = 0; i < 3; i++) {
      const an = T * .8 + i * 2.09;
      ctx.beginPath();
      ctx.arc(Math.cos(an) * cw * .56, Math.sin(an) * ch * .56, 8, 0, 6.283);
      ctx.fill();
    }
  });
}
function chartScene(sc, p, T, u, down) {
  const cw = Math.min(W * .84, u * 1.2), ch = u * .56, cy = H * .57;
  const s = back((p - .15) / .5), a = ease((p - .1) / .3);
  const cnt = ease(p / Math.min(2.5, sc.d * .7));

    const x0 = -cw * .42, x1 = cw * .42, y0 = -ch * .1, y1 = ch * .38, n = 24, pts = [];
    for (let i = 0; i < n; i++) {
      const base = down ? 1 - i / (n - 1) : i / (n - 1);

      const v = clamp(base * .9 + .05 + nz);

    }

    ctx.lineWidth = 2;

    ctx.fillStyle = sc.col;
    ctx.beginPath();
    ctx.moveTo(draw[0][0], y1);
    draw.forEach(q => ctx.lineTo(q[0], q[1]));
    ctx.lineTo(draw[draw.length - 1][0], y1);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = a;
    ctx.strokeStyle = sc.col;
    ctx.lineWidth = u * .012;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    draw.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]));

    const e = draw[draw.length - 1], fq = (T * 1.5) % 1;
    ctx.fillStyle = sc.col;
    ctx.beginPath();
    ctx.arc(e[0], e[1], u * .02 + u * .006 * Math.sin(T * 6), 0, 6.283);
    ctx.fill();
    ctx.globalAlpha = a * (1 - fq);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(e[0], e[1], u * .02 + fq * u * .06, 0, 6.283);
    ctx.stroke();
    ctx.globalAlpha = a;
    if (sc.num) txt(fmtNum(sc.num, cnt), 0, -ch * .3, fit(fmtNum(sc.num, 1), u * .11, 900, cw * .8), sc.col, 900);

}
function listScene(sc, p, T, u, hs) {
  const items = sc.items.slice(0, 5), n = items.length;
  const top = H * .3, avail = H * .65;
  const bw = Math.min(W * .86, u * 1.3), bh = Math.min(hs * 1.9, avail / (n * 1.25));
  const step = Math.min(.6, sc.d * .7 / n);
  items.forEach((it, i) => {
    const q = clamp((p - .5 - i * step) / .5), e = back(q), side = i % 2 ? 1 : -1;
    const x = W / 2 + side * (1 - ease(q)) * W * .5, y = top + bh / 2 + i * bh * 1.25 + Math.sin(T * 2 + i) * 5;
    ctx.save();
    ctx.globalAlpha = clamp(q * 2);
    ctx.translate(x, y);
    ctx.scale(.9 + .1 * e, .9 + .1 * e);
    ctx.shadowColor = rgba(sc.col, .4);
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 8;
    ctx.fillStyle = 'rgba(20,24,42,.94)';
    rr(-bw / 2, -bh / 2, bw, bh, bh / 2);
    ctx.fill();
    noShadow();
    ctx.strokeStyle = rgba(sc.col, .7);
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = sc.col;
    ctx.beginPath();
    ctx.arc(-bw / 2 + bh / 2, 0, bh * .34, 0, 6.283);
    ctx.fill();
    txt(String(i + 1), -bw / 2 + bh / 2, 0, bh * .4, '#fff', 900);

function chips(sc, p, T, u) {
  const items = sc.items.slice(0, 4);
  if (!items.length) return;
  const sz = u * .04, gap = u * .025, keep = [];
  ctx.font = '700 ' + sz + 'px ' + FONT;
  let tot = -gap;
  for (const it of items) {
    const w = ctx.measureText(it).width + sz * 1.6;
    if (tot + gap + w > W * .92) break;
    tot += gap + w;
    keep.push([it, w]);
  }
  let x = W / 2 - tot / 2;

    const q = back((p - .8 - i * .15) / .45), y = H * .9 + Math.sin(T * 2 + i * 1.3) * 7;
    ctx.save();
    ctx.globalAlpha = clamp(q * 2);
    ctx.translate(x + w / 2, y);
    ctx.scale(Math.max(.01, q), Math.max(.01, q));
    ctx.fillStyle = rgba(sc.col, .22);
    rr(-w / 2, -sz, w, sz * 2, sz);
    ctx.fill();
    ctx.strokeStyle = rgba(sc.col, .8);
    ctx.lineWidth = 2;
    ctx.stroke();
    txt(it, 0, 0, sz, '#fff', 700);
    ctx.restore();
    x += w + gap;

/* ================= NEW STYLES (5) ================= */
/* 1) kinetic: tilted headline + gradient pill */
function kineticScene(sc, p, T, u, hs, mw) {
  ctx.save();
  ctx.translate(W / 2, H * .4);
  ctx.rotate(-.07 * (1 - ease(p / 1.1)) - .015 + Math.sin(T * .7) * .01);
  kin(sc.headline, 0, 0, hs * 1.3, mw, p, T, '#fff', sc.col);
  ctx.restore();

  if (!label) return;
  const q = back((p - .8) / .5), sz = u * .05;
  ctx.font = '900 ' + sz + 'px ' + FONT;
  const w = ctx.measureText(label).width + sz * 2.4, h = sz * 2.1;

  ctx.globalAlpha = clamp(q * 2);

  ctx.scale(Math.max(.01, q), Math.max(.01, q));

/* 2) search: URL bar typing + mic + suggestions */
function searchScene(sc, p, T, u) {
  const size = u * .045, bw = Math.min(W * .86, u * 1.25), lh = size * 1.5;

    const ix = -bw / 2 + size * 1.3, tx = ix + size * 1.1, my = -(L.length - 1) * lh / 2;

      ctx.fillStyle = rgba(sc.col, .25); ctx.beginPath(); ctx.arc(-rw / 2 + rh * .55, 0, rh * .26, 0, 6.283); ctx.fill();
      txt('↗', -rw / 2 + rh * .55, 0, rh * .3, sc.col, 900);
      txt(it, -rw / 2 + rh * 1.05, 0, fit(it, size * .85, 700, rw - rh * 1.5), '#fff', 700, 'left');
    });
  });

/* 3) device: laptop tilts in, UI rows appear */
function deviceScene(sc, p, T, u, hs, mw) {
  kin(sc.headline, W / 2, H * (W > H ? .15 : .14), hs * .85, mw, p, T, '#fff', sc.col);

  ctx.shadowColor = rgba(sc.col, .5); ctx.shadowBlur = 50; ctx.shadowOffsetY = 24;
