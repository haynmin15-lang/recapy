<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RECAPY Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#0b0b10;color:#fff;font-family:"Noto Sans Myanmar",system-ui,sans-serif}
a.back{color:#ff3535;text-decoration:none;font-size:14px}
h1{font-size:16px;margin:8px 0}
#wrap{margin:0 auto;width:100%}
canvas{width:100%;height:auto;display:block;background:#000;border-radius:10px}
.bar{display:flex;gap:8px;align-items:center;margin:10px auto 0;max-width:640px}
button{background:#ff3535;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px}
button.g{background:#2a2a35}
input[type=range]{flex:1;min-width:0}
#tm{font-size:12px;color:#bbb;text-align:center;margin-top:6px}
#st{text-align:center;color:#aaa;font-size:14px;margin:10px 0}
</style>
</head>
<body>
<a class="back" href="index.html">← Back</a>
<h1 id="ttl">Preview</h1>
<div id="wrap"><canvas id="cv" width="1280" height="720"></canvas></div>
<div class="bar">
<button id="play">▶ Play</button>
<button id="restart" class="g">↺</button>
<input type="range" id="seek" min="0" max="1000" value="0">
</div>
<div id="tm">0:00 / 0:00</div>
<div id="st">Loading...</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL = 'https://jqsawjvtshlaqyhqluxb.supabase.co';
const $ = id => document.getElementById(id);
const st = $('st'), cv = $('cv'), ctx = cv.getContext('2d'), seek = $('seek');
const audio = new Audio();
audio.preload = 'auto';
const MOODS = { negative:'#ff3535', positive:'#2ecc71', neutral:'#4a90e2', urgent:'#ff9f1a' };
const FONT = '"Noto Sans Myanmar","Padauk","Myanmar Text",sans-serif';
const MY = '၀၁၂၃၄၅၆၇၈၉';
let scenes = [], W = 1280, H = 720, dur = 0;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - x, 3);
const toEn = s => String(s).replace(/[၀-၉]/g, c => MY.indexOf(c));
const toMy = s => String(s).replace(/[0-9]/g, c => MY[+c]);
function fmt(t) { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function toSec(v) {
  if (typeof v === 'number') return v;
  if (typeof v === 'string') {
    if (v.includes(':')) return v.split(':').map(Number).reduce((a, b) => a * 60 + b, 0);
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }
  return 0;
}
function parseNum(s) {
  if (!s) return null;
  const raw = String(s), en = toEn(raw);
  const m = en.match(/[0-9][0-9,]*\.?[0-9]*/);
  if (!m) return null;
  const ns = m[0].replace(/,/g, ''), val = parseFloat(ns);
  if (isNaN(val)) return null;
  return { val, dec: (ns.split('.')[1] || '').length, pre: en.slice(0, m.index), suf: en.slice(m.index + m[0].length), my: /[၀-၉]/.test(raw) };
}
function fmtNum(n, x) {
  let s = (n.val * x).toFixed(n.dec);
  if (n.my) s = toMy(s);
  return n.pre + s + n.suf;
}
function seg(s) {
  try { return Array.from(new Intl.Segmenter('my', { granularity: 'grapheme' }).segment(s), x => x.segment); }
  catch (e) { return Array.from(s); }
}
function wrap(txt, maxW) {
  const out = [];
  let line = '';
  for (const tok of String(txt).split(/\s+/).filter(Boolean)) {
    const t = line ? line + ' ' + tok : tok;
    if (ctx.measureText(t).width <= maxW) { line = t; continue; }
    if (line) { out.push(line); line = ''; }
    if (ctx.measureText(tok).width <= maxW) { line = tok; continue; }
    let cur = '';
    for (const g of seg(tok)) {
      if (cur && ctx.measureText(cur + g).width > maxW) { out.push(cur); cur = g; }
      else cur += g;
    }
    line = cur;
  }
  if (line) out.push(line);
  return out;
}
function text(str, x, y, size, color, weight, maxW, alpha) {
  ctx.font = weight + ' ' + size + 'px ' + FONT;
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const lines = wrap(str, maxW), h = size * 1.6, y0 = y - (lines.length - 1) * h / 2;
  lines.forEach((l, i) => ctx.fillText(l, x, y0 + i * h));
  ctx.globalAlpha = 1;
}
function sceneAt(t) {
  let s = scenes[0];
  for (const c of scenes) if (t >= c.s) s = c;
  return s;
}
function chart(sc, p, d, col, a, u, down) {
  const x0 = W * 0.08, x1 = W * 0.92, y0 = H * 0.5, y1 = H * 0.9, n = 24, pts = [];
  for (let i = 0; i < n; i++) {
    const base = down ? 1 - i / (n - 1) : i / (n - 1);
    const nz = (i > 0 && i < n - 1) ? (Math.sin(i * 7.3) * 0.5 + Math.sin(i * 2.1 + 1) * 0.5) * 0.08 : 0;
    const v = clamp(base * 0.9 + 0.05 + nz);
    pts.push([x0 + (x1 - x0) * i / (n - 1), y0 + (1 - v) * (y1 - y0)]);
  }
  ctx.globalAlpha = a * 0.15;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  for (let k = 0; k < 4; k++) {
    const y = y0 + (y1 - y0) * k / 3;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  }
  const prog = ease(clamp(p / Math.min(3, d * 0.8))) * (n - 1);
  const k = Math.floor(prog), fr = prog - k;
  const draw = pts.slice(0, k + 1);
  if (k < n - 1) draw.push([pts[k][0] + (pts[k + 1][0] - pts[k][0]) * fr, pts[k][1] + (pts[k + 1][1] - pts[k][1]) * fr]);
  ctx.globalAlpha = a * 0.25;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(draw[0][0], y1);
  draw.forEach(q => ctx.lineTo(q[0], q[1]));
  ctx.lineTo(draw[draw.length - 1][0], y1);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = a;
  ctx.strokeStyle = col;
  ctx.lineWidth = u * 0.012;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  draw.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]));
  ctx.stroke();
  const e = draw[draw.length - 1];
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(e[0], e[1], u * 0.02, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawFrame(t) {
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#0b0b10';
  ctx.fillRect(0, 0, W, H);
  const sc = sceneAt(t);
  if (!sc) return;
  const col = sc.col, p = Math.max(0, t - sc.s), d = Math.max(0.5, sc.e - sc.s);
  const last = sc === scenes[scenes.length - 1];
  const a = Math.min(clamp(p / 0.5), last ? 1 : clamp((sc.e - t) / 0.3));
  const u = Math.min(W, H), mw = W * 0.86, hs = u * 0.075;
  const g = ctx.createRadialGradient(W / 2, H * 0.35, 0, W / 2, H * 0.35, Math.max(W, H) * 0.8);
  g.addColorStop(0, col);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.3 * a;
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.fillStyle = col;
  ctx.fillRect(0, 0, W * clamp(p / d), 8);
  const slide = (1 - ease(clamp(p / 0.6))) * 40;
  const num = sc.num;
  const cnt = ease(clamp(p / Math.min(2.5, d * 0.7)));
  const m = sc.motion;
  if (m === 'number_counter' && num) {
    text(sc.headline, W / 2, H * 0.2 + slide, hs, '#fff', 700, mw, a);
    text(fmtNum(num, cnt), W / 2, H * 0.55, u * 0.17, col, 900, mw, a);
  } else if (m === 'chart_up' || m === 'chart_down') {
    text(sc.headline, W / 2, H * 0.17 + slide, hs, '#fff', 700, mw, a);
    if (num) text(fmtNum(num, cnt), W / 2, H * 0.37, u * 0.11, col, 900, mw, a);
    chart(sc, p, d, col, a, u, m === 'chart_down');
  } else if (m === 'list' && sc.items.length) {
    text(sc.headline, W / 2, H * 0.16 + slide, hs, '#fff', 700, mw, a);
    const step = Math.min(0.6, (d * 0.7) / sc.items.length);
    sc.items.forEach((it, i) => {
      const q = clamp((p - 0.5 - i * step) / 0.4);
      text('• ' + it, W / 2, H * 0.34 + i * hs * 1.9 + (1 - q) * 30, hs * 0.9, col, 700, mw, a * q);
    });
  } else if (m === 'quote') {
    text('“', W / 2, H * 0.24, u * 0.3, col, 900, mw, a * 0.5);
    text(sc.headline, W / 2, H * 0.55 + slide, hs * 1.1, '#fff', 700, mw, a);
  } else {
    text(sc.headline, W / 2, H * 0.5 + slide, hs * 1.3, '#fff', 700, mw, a);
    if (num) text(fmtNum(num, cnt), W / 2, H * 0.75, u * 0.1, col, 900, mw, a);
  }
}
function loop() {
  const t = audio.currentTime || 0;
  dur = (audio.duration && isFinite(audio.duration)) ? audio.duration : (scenes.length ? scenes[scenes.length - 1].e : 0);
  try { drawFrame(t); } catch (e) { st.textContent = 'Draw error: ' + e.message; }
  if (document.activeElement !== seek) seek.value = dur ? (t / dur) * 1000 : 0;
  $('tm').textContent = fmt(t) + ' / ' + fmt(dur);
  requestAnimationFrame(loop);
}
async function getKey() {
  const r = await fetch('index.html', { cache: 'no-store' });
  const t = await r.text();
  const m = t.match(/sb_publishable_[A-Za-z0-9_\-]+/) || t.match(/eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+/);
  if (!m) throw new Error('Key not found in index.html');
  return m[0];
}
$('play').onclick = () => {
  if (audio.paused) audio.play().catch(e => { st.textContent = 'Audio error: ' + e.message; });
  else audio.pause();
};
audio.onplay = () => { $('play').textContent = '⏸ Pause'; };
audio.onpause = () => { $('play').textContent = '▶ Play'; };
$('restart').onclick = () => { audio.currentTime = 0; audio.play().catch(() => {}); };
seek.oninput = () => { audio.currentTime = (seek.value / 1000) * (dur || 1); };
(async () => {
  try {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) throw new Error('No project id');
    const sb = createClient(SB_URL, await getKey());
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.href = 'login.html'; return; }
    const { data: p, error } = await sb.from('projects').select('title,aspect_ratio,audio_path,scenes').eq('id', id).single();
    if (error) throw error;
    let raw = p.scenes;
    if (raw && !Array.isArray(raw) && Array.isArray(raw.scenes)) raw = raw.scenes;
    if (!Array.isArray(raw) || !raw.length) throw new Error('No scenes. Analyze scenes first.');
    scenes = raw.map(s => {
      const kw = Array.isArray(s.keywords) ? s.keywords : (s.keywords ? String(s.keywords).split(',') : []);
      const ok = typeof s.color === 'string' && /^#[0-9a-f]{3,8}$/i.test(s.color.trim());
      return {
        s: toSec(s.start), e: toSec(s.end), headline: s.headline || '',
        items: kw.map(x => String(x).trim()).filter(Boolean),
        num: parseNum(s.big_number), motion: s.motion || 'headline',
        col: ok ? s.color.trim() : (MOODS[s.mood] || MOODS.neutral)
      };
    }).sort((x, y) => x.s - y.s);
    const r = p.aspect_ratio || '16:9';
    if (r === '9:16') { W = 720; H = 1280; } else if (r === '1:1') { W = 1000; H = 1000; }
    cv.width = W; cv.height = H;
    $('wrap').style.maxWidth = r === '9:16' ? 'min(100%, 36vh)' : (r === '1:1' ? 'min(100%, 62vh)' : '100%');
    $('ttl').textContent = p.title || 'Preview';
    const { data: sg, error: e2 } = await sb.storage.from('audio').createSignedUrl(p.audio_path, 3600);
    if (e2) throw e2;
    audio.src = sg.signedUrl;
    try {
      await Promise.race([document.fonts.load('700 40px "Noto Sans Myanmar"', 'မြန်မာ'), new Promise(r => setTimeout(r, 4000))]);
    } catch (e) {}
    st.textContent = 'Ready. Tap Play.';
    loop();
  } catch (e) {
    st.textContent = 'Error: ' + (e.message || e);
  }
})();
</script>
</body>
  </html>
