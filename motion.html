<!DOCTYPE html>
<html lang="my">

<body>
<a class="back" href="index.html">← Back</a>
<h1 id="ttl">Preview</h1>
<div id="wrap"><canvas id="cv" width="1280" height="720"></canvas></div>
<div class="bar">
  <button id="play">▶ Play</button>
  <button id="restart" class="g">↺</button>
  <input type="range" id="seek" min="0" max="1000" value="0">
</div>
<div id="tm">0:00 / 0:00</div>
<div id="st">Loading...</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL = 'https://jqsawjvtshlaqyhqluxb.supabase.co';
const $ = id => document.getElementById(id);
const st = $('st'), cv = $('cv'), ctx = cv.getContext('2d'), seek = $('seek');
const audio = new Audio();
audio.preload = 'auto';

const MOODS = { negative:'#ff3535', positive:'#2ecc71', neutral:'#4c8df6', urgent:'#ff9f1a' };
const FONT = '"Noto Sans Myanmar","Padauk","Myanmar Text",sans-serif';
const MY = '၀၁၂၃၄၅၆၇၈၉';
const NEWK = ['kinetic', 'search', 'device', 'ranking', 'aurora'];
const ALIAS = { laptop: 'device', dashboard: 'device', logos: 'ranking', glow: 'aurora' };

let scenes = [], W = 1280, H = 720, dur = 0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => {
  x = clamp(x);
  const c = 1.70158, k = c + 1;
  return 1 + k * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
};
const toEn = s => String(s).replace(/[၀-၉]/g, c => MY.indexOf(c));
const toMy = s => String(s).replace(/[0-9]/g, c => MY[+c]);

function rgba(h, a) {
  h = String(h || '#4c8df6').replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const n = parseInt(h, 16);
  if (isNaN(n)) return `rgba(76,141,246,${a})`;
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function fmt(t) {
  t = Math.max(0, Math.floor(t || 0));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}
function toSec(v) {
  if (typeof v === 'number' && isFinite(v)) return v;
  if (typeof v === 'string') {
    const s = v.trim();
    if (s.includes(':')) return s.split(':').map(Number).reduce((a, b) => a * 60 + b, 0);
    const n = parseFloat(toEn(s));
    return isNaN(n) ? 0 : n;
  }
  return 0;
}
function parseNum(s) {
  if (s === null || s === undefined || s === '') return null;
  const raw = String(s), en = toEn(raw);
  const m = en.match(/[0-9][0-9,]*\.?[0-9]*/);
  if (!m) return null;
  const ns = m[0].replace(/,/g, ''), val = parseFloat(ns);
  if (isNaN(val)) return null;
  return {
    val,
    dec: (ns.split('.')[1] || '').length,
    pre: en.slice(0, m.index),
    suf: en.slice(m.index + m[0].length),
    my: /[၀-၉]/.test(raw)
  };
}
function fmtNum(n, x) {
  let s = (n.val * clamp(x, 0, 1)).toFixed(n.dec);
  if (n.my) s = toMy(s);
  return n.pre + s + n.suf;
}
function seg(s) {
  try {
    return Array.from(new Intl.Segmenter('my', { granularity: 'grapheme' }).segment(s), x => x.segment);
  } catch (e) {
    return Array.from(s);
  }
}
function wrap(txtStr, maxW) {
  const out = [];
  let line = '';
  for (const tok of String(txtStr || '').split(/\s+/).filter(Boolean)) {
    const t = line ? line + ' ' + tok : tok;
    if (ctx.measureText(t).width <= maxW) { line = t; continue; }
    if (line) { out.push(line); line = ''; }
    if (ctx.measureText(tok).width <= maxW) { line = tok; continue; }
    let cur = '';
    for (const g of seg(tok)) {
      if (cur && ctx.measureText(cur + g).width > maxW) { out.push(cur); cur = g; }
      else cur += g;
    }
    line = cur;
  }
  if (line) out.push(line);
  return out.length ? out : [''];
}
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fit(s, size, wt, maxW) {
  ctx.font = `${wt} ${size}px ${FONT}`;
  const w = ctx.measureText(String(s || '')).width;
  return w > maxW && maxW > 0 ? size * maxW / w : size;
}
function txt(s, x, y, size, color, wt, al = 'center') {
  ctx.font = `${wt} ${size}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.textAlign = al;
  ctx.textBaseline = 'middle';
  ctx.fillText(String(s || ''), x, y);
}
function noShadow() {
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
}
function sceneAt(t) {
  if (!scenes.length) return null;
  let s = scenes[0];
  for (const c of scenes) if (t >= c.s) s = c;
  return s;
}

/* ---------- background ---------- */
function bg(col, T, auroraMode = false) {
  ctx.globalAlpha = 1;
  ctx.fillStyle = auroraMode ? '#050807' : '#090b14';
  ctx.fillRect(0, 0, W, H);

  const count = auroraMode ? 4 : 3;
  for (let i = 0; i < count; i++) {
    const x = W * (.5 + .38 * Math.sin(T * (.32 + i * .05) + i * 2.1));
    const y = H * (.5 + .35 * Math.cos(T * (.26 + i * .04) + i * 1.7));
    const r = Math.max(W, H) * ((auroraMode ? .55 : .45) + .1 * Math.sin(T + i));
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const tint = auroraMode && i === 0 ? '#1db954' : col;
    g.addColorStop(0, rgba(tint, auroraMode ? (i ? .22 : .38) : (i ? .2 : .32)));
    g.addColorStop(1, rgba(tint, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  const u = Math.min(W, H), gap = u * .07, off = (T * u * .02) % gap;
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  ctx.beginPath();
  for (let x = -gap + off; x < W + gap; x += gap) {
    for (let y = -gap + off; y < H + gap; y += gap) {
      ctx.moveTo(x + u * .0035, y);
      ctx.arc(x, y, u * .0035, 0, Math.PI * 2);
    }
  }
  ctx.fill();

  ctx.fillStyle = rgba(col, .32);
  for (let i = 0; i < 14; i++) {
    const sp = .03 + (i % 5) * .01;
    const px = ((i * .137 + T * sp) % 1) * W;
    const py = H - ((i * .291 + T * sp * 1.5) % 1) * H;
    ctx.beginPath();
    ctx.arc(px, py, u * (.005 + (i % 4) * .0035), 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---------- kinetic headline ---------- */
function kin(str, cx, cy, size, maxW, p, T, color, barCol) {
  ctx.font = `900 ${size}px ${FONT}`;
  const lines = wrap(str, maxW), h = size * 1.45, y0 = cy - (lines.length - 1) * h / 2;
  lines.forEach((l, i) => {
    const q = clamp((p - i * .16) / .55), e = back(q);
    ctx.save();
    ctx.globalAlpha = clamp(q * 2);
    ctx.translate(cx, y0 + i * h + (1 - e) * size * 1.15 + Math.sin(T * 1.6 + i) * size * .035);
    ctx.rotate((1 - e) * (i % 2 ? .08 : -.08));
    ctx.scale(.86 + .14 * e, .86 + .14 * e);
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = 12;
    txt(l, 0, 0, size, color, 900);
    ctx.restore();
  });
  const bw = ease((p - .45) / .5) * Math.min(maxW * .55, size * 3.2) * (1 + .06 * Math.sin(T * 3));
  ctx.fillStyle = barCol;
  rr(cx - bw / 2, y0 + (lines.length - 1) * h + h * .58, bw, size * .1, size * .05);
  ctx.fill();
}

function panel(cx, cy, w, h, col, s, a, fn) {
  ctx.save();
  ctx.globalAlpha = clamp(a);
  ctx.translate(cx, cy);
  const k = Math.max(.01, s);
  ctx.scale(k, k);
  ctx.shadowColor = rgba(col, .45);
  ctx.shadowBlur = 42;
  ctx.shadowOffsetY = 16;
  ctx.fillStyle = 'rgba(18,22,38,.94)';
  rr(-w / 2, -h / 2, w, h, Math.min(w, h) * .09);
  ctx.fill();
  noShadow();
  ctx.strokeStyle = rgba(col, .65);
  ctx.lineWidth = 2.5;
  ctx.stroke();
  if (fn) fn();
  ctx.restore();
}

/* ---------- legacy scene types ---------- */
function numScene(sc, p, T, u) {
  const cw = Math.min(W * .8, u * 1.12), ch = u * .5, cy = H * .56;
  const s = back((p - .12) / .5) * (1 + .015 * Math.sin(T * 3)), a = ease((p - .08) / .3);
  const cnt = ease(p / Math.min(2.5, sc.d * .7));
  panel(W / 2, cy, cw, ch, sc.col, s, a, () => {
    const sz = fit(fmtNum(sc.num, 1), u * .2, 900, cw * .86);
    txt(fmtNum(sc.num, cnt), 0, -ch * .08, sz, sc.col, 900);
    const bw = cw * .7, by = ch * .3;
    ctx.fillStyle = 'rgba(255,255,255,.1)';
    rr(-bw / 2, by, bw, 16, 8);
    ctx.fill();
    ctx.fillStyle = sc.col;
    rr(-bw / 2, by, Math.max(16, bw * cnt), 16, 8);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-bw / 2 + bw * cnt, by + 8, 14 + 3 * Math.sin(T * 6), 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 3; i++) {
      const an = T * .8 + i * 2.09;
      ctx.beginPath();
      ctx.arc(Math.cos(an) * cw * .56, Math.sin(an) * ch * .56, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function chartScene(sc, p, T, u, down) {
  const cw = Math.min(W * .84, u * 1.22), ch = u * .56, cy = H * .57;
  const s = back((p - .12) / .5), a = ease((p - .08) / .3);
  const cnt = ease(p / Math.min(2.5, sc.d * .7));
  panel(W / 2, cy, cw, ch, sc.col, s, a, () => {
    const x0 = -cw * .42, x1 = cw * .42, y0 = -ch * .1, y1 = ch * .38, n = 24, pts = [];
    for (let i = 0; i < n; i++) {
      const base = down ? 1 - i / (n - 1) : i / (n - 1);
      const nz = (i > 0 && i < n - 1) ? (Math.sin(i * 7.3 + T * 1.2) * .5 + Math.sin(i * 2.1 + 1 + T * .7) * .5) * .08 : 0;
      const v = clamp(base * .9 + .05 + nz);
      pts.push([x0 + (x1 - x0) * i / (n - 1), y1 - v * (y1 - y0)]);
    }
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = 2;
    for (let k = 0; k < 4; k++) {
      const y = y0 + (y1 - y0) * k / 3;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    }
    const prog = ease(p / Math.min(3, sc.d * .8)) * (n - 1);
    const k = Math.min(n - 1, Math.floor(prog)), fr = prog - k;
    const draw = pts.slice(0, k + 1);
    if (k < n - 1) draw.push([pts[k][0] + (pts[k + 1][0] - pts[k][0]) * fr, pts[k][1] + (pts[k + 1][1] - pts[k][1]) * fr]);
    ctx.globalAlpha = a * .25;
    ctx.fillStyle = sc.col;
    ctx.beginPath();
    ctx.moveTo(draw[0][0], y1);
    draw.forEach(q => ctx.lineTo(q[0], q[1]));
    ctx.lineTo(draw[draw.length - 1][0], y1);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = a;
    ctx.strokeStyle = sc.col;
    ctx.lineWidth = u * .012;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    draw.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]));
    ctx.stroke();
    const e = draw[draw.length - 1], fq = (T * 1.5) % 1;
    ctx.fillStyle = sc.col;
    ctx.beginPath();
    ctx.arc(e[0], e[1], u * .02 + u * .006 * Math.sin(T * 6), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = a * (1 - fq);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(e[0], e[1], u * .02 + fq * u * .06, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = a;
    if (sc.num) txt(fmtNum(sc.num, cnt), 0, -ch * .3, fit(fmtNum(sc.num, 1), u * .11, 900, cw * .8), sc.col, 900);
    else txt(down ? '▼' : '▲', 0, -ch * .3, u * .09, sc.col, 900);
  });
}

function listScene(sc, p, T, u, hs) {
  const items = sc.items.slice(0, 5), n = items.length;
  const top = H * .29, avail = H * .64;
  const bw = Math.min(W * .86, u * 1.32), bh = Math.min(hs * 1.85, avail / (n * 1.25));
  const step = Math.min(.55, sc.d * .65 / Math.max(1, n));
  items.forEach((it, i) => {
    const q = clamp((p - .35 - i * step) / .48), e = back(q), side = i % 2 ? 1 : -1;
    const x = W / 2 + side * (1 - ease(q)) * W * .45;
    const y = top + bh / 2 + i * bh * 1.24 + Math.sin(T * 2 + i) * 4;
    ctx.save();
    ctx.globalAlpha = clamp(q * 2);
    ctx.translate(x, y);
    ctx.scale(.92 + .08 * e, .92 + .08 * e);
    ctx.shadowColor = rgba(sc.col, .35);
    ctx.shadowBlur = 22;
    ctx.shadowOffsetY = 8;
    ctx.fillStyle = 'rgba(20,24,42,.94)';
    rr(-bw / 2, -bh / 2, bw, bh, bh / 2);
    ctx.fill();
    noShadow();
    ctx.strokeStyle = rgba(sc.col, .7);
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = sc.col;
    ctx.beginPath();
    ctx.arc(-bw / 2 + bh / 2, 0, bh * .34, 0, Math.PI * 2);
    ctx.fill();
    txt(String(i + 1), -bw / 2 + bh / 2, 0, bh * .4, '#fff', 900);
    txt(it, -bw / 2 + bh * 1.05, 0, fit(it, hs * .78, 700, bw - bh * 1.45), '#fff', 700, 'left');
    ctx.restore();
  });
}

/* ---------- new motion styles (5 styles) ---------- */
function kineticScene(sc, p, T, u, hs, mw) {
  const pillText = sc.items[0] || (sc.num ? fmtNum(sc.num, 1) : 'FEATURE');
  const qPill = back((p - .12) / .45);
  const pw = Math.min(mw * .65, Math.max(u * .24, pillText.length * u * .024 + u * .09));
  const ph = Math.max(44, u * .068);
  const py = H * .25 + Math.sin(T * 2.2) * 5;

  ctx.save();
  ctx.globalAlpha = clamp(qPill * 2);
  ctx.translate(W / 2, py);
  ctx.scale(.8 + .2 * qPill, .8 + .2 * qPill);
  const grad = ctx.createLinearGradient(-pw / 2, -ph / 2, pw / 2, ph / 2);
  grad.addColorStop(0, sc.col);
  grad.addColorStop(1, '#7c5cff');
  ctx.shadowColor = rgba(sc.col, .5);
  ctx.shadowBlur = 26;
  ctx.fillStyle = grad;
  rr(-pw / 2, -ph / 2, pw, ph, ph / 2);
  ctx.fill();
  noShadow();
  txt(pillText, 0, 0, fit(pillText, ph * .46, 900, pw - 28), '#fff', 900);
  ctx.restore();

  kin(sc.headline, W / 2, H * .54, hs * 1.22, mw, p, T, '#fff', sc.col);
}

function searchScene(sc, p, T, u, hs, mw) {
  const bw = Math.min(mw * .94, u * 1.38), bh = Math.max(64, u * .105);
  const by = H * .34 + Math.sin(T * 1.8) * 3;
  const s = back((p - .08) / .45), a = ease((p - .05) / .25);

  panel(W / 2, by, bw, bh, sc.col, s, a, () => {
    const r = bh * .22, lx = -bw / 2 + bh * .56;
    ctx.strokeStyle = sc.col;
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(lx, 0, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx + r * .7, r * .7); ctx.lineTo(lx + r * 1.45, r * 1.45); ctx.stroke();

    const query = sc.headline || 'Search';
    const gList = seg(query);
    const typedCount = Math.min(gList.length, Math.floor(clamp((p - .25) / .9) * (gList.length + 1)));
    const shown = gList.slice(0, typedCount).join('');
    const tsz = fit(query, bh * .42, 700, bw - bh * 2.2);
    txt(shown, lx + bh * .55, 0, tsz, '#fff', 700, 'left');

    ctx.font = `700 ${tsz}px ${FONT}`;
    const curX = lx + bh * .55 + ctx.measureText(shown).width + 6;
    if (Math.floor(T * 3) % 2 === 0) {
      ctx.fillStyle = sc.col;
      ctx.fillRect(curX, -tsz * .45, 3, tsz * .9);
    }

    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath(); ctx.arc(bw / 2 - bh * .48, 0, bh * .26, 0, Math.PI * 2); ctx.fill();
    txt('🎙', bw / 2 - bh * .48, 0, bh * .3, '#fff', 700);
  });

  const rows = (sc.items.length ? sc.items : ['Result 1', 'Result 2', 'Result 3']).slice(0, 3);
  const ry0 = by + bh * .78, rh = Math.max(46, u * .072), gap = rh * .25;
  rows.forEach((item, i) => {
    const q = clamp((p - .55 - i * .18) / .4), e = back(q);
    ctx.save();
    ctx.globalAlpha = clamp(q * 2);
    ctx.translate(W / 2, ry0 + i * (rh + gap) + (1 - e) * 24);
    ctx.fillStyle = 'rgba(22,27,46,.88)';
    rr(-bw * .46, -rh / 2, bw * .92, rh, rh / 2);
    ctx.fill();
    ctx.strokeStyle = rgba(sc.col, i === 0 ? .8 : .28);
    ctx.lineWidth = i === 0 ? 2.5 : 1.5;
    ctx.stroke();
    ctx.fillStyle = sc.col;
    ctx.beginPath(); ctx.arc(-bw * .46 + rh * .55, 0, rh * .16, 0, Math.PI * 2); ctx.fill();
    txt(item, -bw * .46 + rh * .95, 0, fit(item, rh * .44, 700, bw * .78), '#fff', 700, 'left');
    ctx.restore();
  });
}

function deviceScene(sc, p, T, u, hs, mw) {
  kin(sc.headline, W / 2, H * .16, hs * .92, mw, p, T, '#fff', sc.col);
  const dw = Math.min(mw * .88, u * 1.24), dh = Math.min(H * .58, u * .72), dy = H * .61;
  const s = back((p - .12) / .5) * (1 + .012 * Math.sin(T * 2.4)), a = ease((p - .08) / .3);

  panel(W / 2, dy, dw, dh, sc.col, s, a, () => {
    const topBar = dh * .13;
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    rr(-dw / 2 + 12, -dh / 2 + 10, dw - 24, topBar, 10);
    ctx.fill();
    const dotCols = ['#ff5f56', '#ffbd2e', '#27c93f'];
    dotCols.forEach((dc, idx) => {
      ctx.fillStyle = dc;
      ctx.beginPath();
      ctx.arc(-dw / 2 + 32 + idx * 20, -dh / 2 + 10 + topBar / 2, 6, 0, Math.PI * 2);
      ctx.fill();
    });

    const rows = (sc.items.length ? sc.items : ['Dashboard Overview', 'Realtime Analytics', 'Export Ready']).slice(0, 4);
    const bodyTop = -dh / 2 + topBar + 24;
    const availH = dh - topBar - 36;
    const rh = Math.min(u * .082, availH / (rows.length * 1.22));
    rows.forEach((rTxt, idx) => {
      const rq = clamp((p - .35 - idx * .15) / .4);
      const ry = bodyTop + rh / 2 + idx * rh * 1.22;
      ctx.save();
      ctx.globalAlpha = clamp(rq * 2);
      ctx.fillStyle = idx === 0 ? rgba(sc.col, .22) : 'rgba(255,255,255,.05)';
      rr(-dw * .44, ry - rh / 2, dw * .88, rh, 12);
      ctx.fill();
      ctx.fillStyle = sc.col;
      rr(-dw * .44 + 14, ry - rh * .22, rh * .44, rh * .44, 8);
      ctx.fill();
      txt(rTxt, -dw * .44 + 28 + rh * .44, ry, fit(rTxt, rh * .44, 700, dw * .72), '#fff', 700, 'left');
      ctx.restore();
    });

    const baseW = dw * 1.12, baseH = Math.max(12, u * .02);
    ctx.fillStyle = 'rgba(200,210,235,.22)';
    rr(-baseW / 2, dh / 2 - 2, baseW, baseH, baseH / 2);
    ctx.fill();
  });
}

function rankingScene(sc, p, T, u, hs, mw) {
  kin(sc.headline, W / 2, H * .16, hs * .92, mw, p, T, '#fff', sc.col);
  if (sc.num) {
    const cnt = ease(p / Math.min(2.2, sc.d * .65));
    txt(fmtNum(sc.num, cnt), W / 2, H * .275, fit(fmtNum(sc.num, 1), hs * .85, 900, mw * .7), sc.col, 900);
  }

  const items = sc.items.slice(0, 5);
  const topY = sc.num ? H * .35 : H * .28;
  const availH = H - topY - H * .08;
  const bw = Math.min(mw * .9, u * 1.32);
  const bh = Math.min(hs * 1.45, availH / Math.max(1, items.length * 1.28));

  items.forEach((it, i) => {
    const q = clamp((p - .25 - i * .14) / .45), e = back(q);
    const ratio = clamp((1 - i * .16) * ease((p - .35 - i * .12) / .65), .22, 1);
    const y = topY + bh / 2 + i * bh * 1.28;

    ctx.save();
    ctx.globalAlpha = clamp(q * 2);
    ctx.translate(W / 2 + (1 - e) * 40, y);
    ctx.fillStyle = 'rgba(18,22,38,.92)';
    rr(-bw / 2, -bh / 2, bw, bh, 14);
    ctx.fill();
    ctx.strokeStyle = rgba(sc.col, .35);
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const barW = (bw - 28) * ratio;
    ctx.fillStyle = rgba(sc.col, .28);
    rr(-bw / 2 + 14, -bh / 2 + 8, barW, bh - 16, 10);
    ctx.fill();

    ctx.fillStyle = sc.col;
    ctx.beginPath(); ctx.arc(-bw / 2 + 36, 0, bh * .28, 0, Math.PI * 2); ctx.fill();
    txt(String(i + 1), -bw / 2 + 36, 0, bh * .34, '#fff', 900);
    txt(it, -bw / 2 + 64, 0, fit(it, bh * .42, 700, bw - 140), '#fff', 700, 'left');
    txt(`${Math.round(ratio * 100)}%`, bw / 2 - 22, 0, bh * .36, '#fff', 700, 'right');
    ctx.restore();
  });
}

function auroraScene(sc, p, T, u, hs, mw) {
  kin(sc.headline, W / 2, H * .38, hs * 1.25, mw, p, T, '#fff', '#1db954');
  const pills = (sc.items.length ? sc.items : ['Explore', 'Motion', 'Studio']).slice(0, 4);
  const sz = u * .042, gap = u * .025;
  ctx.font = `700 ${sz}px ${FONT}`;

  let tot = -gap;
  const list = [];
  for (const label of pills) {
    const w = ctx.measureText(label).width + sz * 1.8;
    if (tot + gap + w > W * .9) break;
    tot += gap + w;
    list.push([label, w]);
  }

  let x = W / 2 - tot / 2;
  list.forEach(([label, w], i) => {
    const q = back((p - .45 - i * .14) / .45);
    const active = i === list.length - 1;
    const y = H * .68 + Math.sin(T * 2 + i * 1.2) * 6;
    ctx.save();
    ctx.globalAlpha = clamp(q * 2);
    ctx.translate(x + w / 2, y);
    ctx.scale(.85 + .15 * q, .85 + .15 * q);
    if (active) {
      ctx.shadowColor = 'rgba(29,185,84,.55)';
      ctx.shadowBlur = 24;
    }
    ctx.fillStyle = active ? '#1db954' : 'rgba(255,255,255,.12)';
    rr(-w / 2, -sz * .95, w, sz * 1.9, sz * .95);
    ctx.fill();
    noShadow();
    ctx.strokeStyle = active ? '#4ade80' : 'rgba(255,255,255,.28)';
    ctx.lineWidth = 2;
    ctx.stroke();
    txt(label, 0, 0, sz, active ? '#06120a' : '#fff', 700);
    ctx.restore();
    x += w + gap;
  });
}

function chips(sc, p, T, u) {
  const items = sc.items.slice(0, 4);
  if (!items.length) return;
  const sz = u * .038, gap = u * .022, keep = [];
  ctx.font = `700 ${sz}px ${FONT}`;
  let tot = -gap;
  for (const it of items) {
    const w = ctx.measureText(it).width + sz * 1.6;
    if (tot + gap + w > W * .92) break;
    tot += gap + w;
    keep.push([it, w]);
  }
  let x = W / 2 - tot / 2;
  keep.forEach(([it, w], i) => {
    const q = back((p - .7 - i * .14) / .42);
    const y = H * .9 + Math.sin(T * 2 + i * 1.3) * 6;
    ctx.save();
    ctx.globalAlpha = clamp(q * 2);
    ctx.translate(x + w / 2, y);
    ctx.scale(Math.max(.01, q), Math.max(.01, q));
    ctx.fillStyle = rgba(sc.col, .22);
    rr(-w / 2, -sz, w, sz * 2, sz);
    ctx.fill();
    ctx.strokeStyle = rgba(sc.col, .8);
    ctx.lineWidth = 2;
    ctx.stroke();
    txt(it, 0, 0, sz, '#fff', 700);
    ctx.restore();
    x += w + gap;
  });
}

/* ---------- main frame renderer ---------- */
function drawFrame(t) {
  const T = performance.now() / 1000;
  const sc = sceneAt(t);
  bg(sc ? sc.col : MOODS.neutral, T, sc && sc.kind === 'aurora');
  if (!sc) return;

  const u = Math.min(W, H), hs = u * .075, mw = W * .86, m = sc.motion;
  const p0 = t - sc.s;
  const p = audio.paused ? Math.max(p0, 1.4) : p0;
  const last = sc === scenes[scenes.length - 1];
  const outA = last ? 1 : clamp((sc.e - t) / .3);
  const hy = H * (W > H ? .17 : .15);
  const listOk = m === 'list' && sc.items.length;

  ctx.save();
  const z = 1 + .035 * clamp(p0 / sc.d) + (1 - outA) * .05;
  ctx.translate(W / 2, H / 2);
  ctx.scale(z, z);
  ctx.translate(-W / 2, -H / 2);

  if (m === 'number_counter' && sc.num) {
    kin(sc.headline, W / 2, hy, hs, mw, p, T, '#fff', sc.col);
    numScene(sc, p, T, u);
  } else if (m === 'chart_up' || m === 'chart_down') {
    kin(sc.headline, W / 2, hy, hs, mw, p, T, '#fff', sc.col);
    chartScene(sc, p, T, u, m === 'chart_down');
  } else if (listOk) {
    kin(sc.headline, W / 2, hy, hs, mw, p, T, '#fff', sc.col);
    listScene(sc, p, T, u, hs);
  } else if (m === 'quote') {
    const q = back(p / .6);
    ctx.save();
    ctx.globalAlpha = .5 * clamp(q);
    ctx.translate(W / 2, H * .24);
    ctx.scale(Math.max(.01, q * (1 + .05 * Math.sin(T * 2))), Math.max(.01, q * (1 + .05 * Math.sin(T * 2))));
    txt('“', 0, 0, u * .4, sc.col, 900);
    ctx.restore();
    kin(sc.headline, W / 2, H * .55, hs * 1.1, mw, p, T, '#fff', sc.col);
  } else if (sc.kind === 'kinetic') {
    kineticScene(sc, p, T, u, hs, mw);
  } else if (sc.kind === 'search') {
    searchScene(sc, p, T, u, hs, mw);
  } else if (sc.kind === 'device') {
    deviceScene(sc, p, T, u, hs, mw);
  } else if (sc.kind === 'ranking') {
    rankingScene(sc, p, T, u, hs, mw);
  } else if (sc.kind === 'aurora') {
    auroraScene(sc, p, T, u, hs, mw);
  } else {
    kin(sc.headline, W / 2, H * .45, hs * 1.3, mw, p, T, '#fff', sc.col);
    if (sc.num) {
      const cnt = ease(p / Math.min(2.5, sc.d * .7));
      ctx.globalAlpha = ease((p - .5) / .4);
      txt(fmtNum(sc.num, cnt), W / 2, H * .72, fit(fmtNum(sc.num, 1), u * .14, 900, mw), sc.col, 900);
      ctx.globalAlpha = 1;
    }
  }

  if (!listOk && sc.kind !== 'kinetic' && sc.kind !== 'aurora') {
    chips(sc, p, T, u);
  }
  ctx.restore();

  ctx.globalAlpha = 1;
  if (outA < 1) {
    ctx.fillStyle = `rgba(9,11,20,${(1 - outA) * .85})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (!audio.paused && p0 >= 0 && p0 < .45) {
    const q = ease(p0 / .45);
    ctx.globalAlpha = .8 * (1 - q * .6);
    ctx.fillStyle = sc.col;
    ctx.fillRect(-W * .5 + q * W * 1.6, 0, W * .5, H);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = sc.col;
  ctx.fillRect(0, 0, W * clamp(p0 / sc.d), 8);
}

function loop() {
  const t = audio.currentTime || 0;
  dur = (audio.duration && isFinite(audio.duration))
    ? audio.duration
    : (scenes.length ? scenes[scenes.length - 1].e : 0);
  try {
    drawFrame(t);
  } catch (e) {
    st.textContent = 'Draw error: ' + e.message;
  }
  if (document.activeElement !== seek) seek.value = dur ? (t / dur) * 1000 : 0;
  $('tm').textContent = fmt(t) + ' / ' + fmt(dur);
  requestAnimationFrame(loop);
}

async function getKey() {
  const r = await fetch('index.html', { cache: 'no-store' });
  const t = await r.text();
  const m = t.match(/sb_publishable_[A-Za-z0-9_\-]+/)
    || t.match(/eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+/);
  if (!m) throw new Error('Key not found in index.html');
  return m[0];
}

$('play').onclick = () => {
  if (audio.paused) {
    audio.play().catch(e => { st.textContent = 'Audio error: ' + e.message; });
  } else {
    audio.pause();
  }
};
audio.onplay = () => { $('play').textContent = '⏸ Pause'; };
audio.onpause = () => { $('play').textContent = '▶ Play'; };
$('restart').onclick = () => {
  audio.currentTime = 0;
  audio.play().catch(() => {});
};
seek.oninput = () => {
  audio.currentTime = (seek.value / 1000) * (dur || 1);
};

(async () => {
  try {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) throw new Error('No project id');

    const sb = createClient(SB_URL, await getKey());
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.href = 'login.html'; return; }

    const { data: p, error } = await sb
      .from('projects')
      .select('title,aspect_ratio,audio_path,scenes')
      .eq('id', id)
      .single();
    if (error) throw error;

    let raw = p.scenes;
    if (raw && !Array.isArray(raw) && Array.isArray(raw.scenes)) raw = raw.scenes;
    if (!Array.isArray(raw) || !raw.length) throw new Error('No scenes. Analyze scenes first.');

    let newIdx = 0;
    scenes = raw.map(s => {
      const kw = Array.isArray(s.keywords)
        ? s.keywords
        : (s.keywords ? String(s.keywords).split(',') : []);
      const items = kw.map(k => String(k).trim()).filter(Boolean);
      const ok = typeof s.color === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(s.color.trim());
      const rawMotion = String(s.motion || '').trim();
      const mm = ALIAS[rawMotion] || rawMotion;

      let kind = '';
      if (NEWK.includes(mm)) {
        kind = mm;
      } else if (!mm || mm === 'headline') {
        kind = NEWK[newIdx % NEWK.length];
        newIdx++;
      }
      if (kind === 'ranking' && items.length < 2) {
        kind = 'kinetic';
      }

      const x = {
        s: toSec(s.start),
        e: toSec(s.end),
        headline: s.headline || '',
        items,
        num: parseNum(s.big_number),
        motion: mm || 'headline',
        kind,
        col: ok ? s.color.trim() : (MOODS[s.mood] || MOODS.neutral)
      };
      x.d = Math.max(.5, x.e - x.s);
      return x;
    }).sort((x, y) => x.s - y.s);

    const r = p.aspect_ratio || '16:9';
    if (r === '9:16') { W = 720; H = 1280; }
    else if (r === '1:1') { W = 1000; H = 1000; }
    cv.width = W;
    cv.height = H;
    $('wrap').style.maxWidth = r === '9:16' ? 'min(100%, 36vh)' : (r === '1:1' ? 'min(100%, 62vh)' : '100%');
    $('ttl').textContent = p.title || 'Preview';

    const { data: sg, error: e2 } = await sb.storage.from('audio').createSignedUrl(p.audio_path, 3600);
    if (e2) throw e2;
    audio.src = sg.signedUrl;

    try {
      await Promise.race([
        document.fonts.load('700 40px "Noto Sans Myanmar"', 'မြန်မာ'),
        new Promise(r => setTimeout(r, 4000))
      ]);
    } catch (e) {}

    st.textContent = 'Ready. Tap Play.';
    loop();
  } catch (e) {
    st.textContent = 'Error: ' + (e.message || e);
  }
})();
</script>
